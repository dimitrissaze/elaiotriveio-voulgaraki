<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Η πρώτη μου σελίδα</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      margin: 0;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.15);
      padding: 2rem 3rem;
      border-radius: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 2.5rem;
    }
    p {
      margin: 1rem 0 0 0;
      font-size: 1.2rem;
    }
    a.button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      background-color: #ffcc00;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background-color: #ffe066;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Καλώς ήρθες!</h1>
    <p>Αυτή είναι μια απλή σελίδα διαδικτύου φτιαγμένη με αγάπη 💛</p>
    <a class="button" href="https://example.com" target="_blank" rel="noopener">Μάθε περισσότερα</a>
  </div>
</body>
</html>
